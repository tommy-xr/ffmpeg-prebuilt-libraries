name: Release FFmpeg binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create/update (example: v0.6.0)"
        required: true
        type: string
      release_name:
        description: "Human friendly release name (defaults to tag)"
        required: false
        type: string
      release_body:
        description: "Release notes (optional)"
        required: false
        type: string
      ffmpeg_version:
        description: "FFmpeg upstream tag to build"
        required: false
        default: "n7.0"
        type: string
      draft:
        description: "Publish as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean
      android_api_level:
        description: "Android API level for cross-compile (e.g., 23, 26)"
        required: false
        default: "26"
        type: string

env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_NAME: ${{ inputs.release_name != '' && inputs.release_name || inputs.release_tag }}
  RELEASE_BODY: ${{ inputs.release_body != '' && inputs.release_body || format('Automated FFmpeg build for {0}', inputs.release_tag) }}
  ANDROID_API_LEVEL: ${{ inputs.android_api_level }}

jobs:
  build-linux:
    name: Build Linux (x64)
    uses: ./.github/workflows/ffmpeg-build-linux.yml
    with:
      ffmpeg_version: ${{ env.FFMPEG_VERSION }}
    secrets: inherit

  build-android:
    name: Build Android (arm64-v8a)
    uses: ./.github/workflows/ffmpeg-build-android-arm64-v8a.yml
    with:
      ffmpeg_version: ${{ env.FFMPEG_VERSION }}
      android_api_level: ${{ env.ANDROID_API_LEVEL }}
    secrets: inherit

  build-windows:
    name: Build Windows (x64)
    uses: ./.github/workflows/ffmpeg-build-windows.yml
    with:
      ffmpeg_version: ${{ env.FFMPEG_VERSION }}
    secrets: inherit

  build-macos-silicon:
    name: Build macOS (Apple Silicon)
    uses: ./.github/workflows/ffmpeg-build-macos-silicon.yml
    with:
      ffmpeg_version: ${{ env.FFMPEG_VERSION }}
    secrets: inherit

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-android
      - build-windows
      - build-macos-silicon
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare asset list
        id: assets
        run: |
          ls -R dist
          assets=(
            "dist/ffmpeg-android-arm64-v8a/ffmpeg-android-arm64-v8a.tar.gz"
            "dist/ffmpeg-linux-x64/ffmpeg-linux-x64.tar.gz"
            "dist/ffmpeg-windows-x64/ffmpeg-windows-x64.tar.gz"
            "dist/ffmpeg-macos-arm64/ffmpeg-macos-arm64.tar.gz"
          )
          missing=0
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Missing asset: $asset"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            exit 1
          fi
          {
            echo "list<<EOF"
            for asset in "${assets[@]}"; do
              echo "$asset"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing assets (if rerun)
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ASSET_PATHS: ${{ steps.assets.outputs.list }}
        with:
          script: |
            const assets = (process.env.ASSET_PATHS || '').split('\n').filter(Boolean);
            if (!assets.length) {
              core.info('No assets recorded, skipping delete step.');
              return;
            }
            const { owner, repo } = context.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.RELEASE_TAG,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release for ${process.env.RELEASE_TAG}, skipping delete.`);
                return;
              }
              throw error;
            }
            const targets = assets.map(asset => asset.split('/').pop());
            for (const asset of release.data.assets) {
              if (targets.includes(asset.name)) {
                core.info(`Deleting existing asset ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/ffmpeg-android-arm64-v8a/ffmpeg-android-arm64-v8a.tar.gz
            dist/ffmpeg-linux-x64/ffmpeg-linux-x64.tar.gz
            dist/ffmpeg-windows-x64/ffmpeg-windows-x64.tar.gz
            dist/ffmpeg-macos-arm64/ffmpeg-macos-arm64.tar.gz
