name: Build FFmpeg (MacOS, Silicon)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg upstream tag to build"
        required: false
        default: "n7.0"
  workflow_call:
    inputs:
      ffmpeg_version:
        required: false
        type: string
        default: "n7.0"

jobs:
  build:
    name: Build FFmpeg for MacOS
    runs-on: macos-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up dependencies on macOS
        run: |
          brew update
          brew install \
            autoconf automake cmake fdk-aac git lame libass libtool \
            libvorbis libvpx opus sdl2 texinfo wget x264 x265 xvid yasm

      - name: Clone ffmpeg
        uses: ./.github/actions/ffmpeg-clone
        with:
          version: ${{ github.event_name == 'workflow_call' && inputs.ffmpeg_version || github.event_name == 'workflow_dispatch' && github.event.inputs.ffmpeg_version || 'n7.0' }}

      - name: Build FFmpeg on MacOS (Silicon, arm64)
        run: |
          cd ffmpeg
          ./configure --enable-shared --enable-static --arch=arm64 --prefix=out-arm64
          make -j1
          make install

      - name: Package artifact
        run: |
          tar -czf ffmpeg-macos-arm64.tar.gz -C ffmpeg/out-arm64 .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-macos-arm64.tar.gz
